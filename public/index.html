<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Security System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>OTP Security System</h1>

      <p class="subtitle">
        Send a secure one-time password
      </p>

      <form id="otpForm">

        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="user@example.com"
          required
        >

        <button type="submit">
          Send OTP
        </button>

      </form>

      <div id="message"></div>

      <div id="otpDisplay"></div>

      <button
        id="resendButton"
        class="secondary"
        style="display: none;"
      >
        Resend OTP
      </button>

      <a href="/verify.html">
        Verify OTP
      </a>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
